
services:
  # Go API: Handles video upload, DynamoDB, and S3 logic
  goapi:
    build: ./backend
    container_name: goapi
    ports:
      - "8080:8080"   # Go API server
    # Update environment variables for S3 and DynamoDB (LocalStack)
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - S3_ENDPOINT=http://localstack:4566
      - DYNAMODB_ENDPOINT=http://localstack:4566
      - S3_BUCKET=mybucket
      - DYNAMODB_TABLE=videos
    depends_on:
      - localstack

  # React Native (Expo for web): Frontend UI
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "19006:19006" # Expo web server
    depends_on:
      - goapi

  # LocalStack: AWS cloud service emulator (S3, DynamoDB, etc.)
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "9007:4566"   # LocalStack edge port (all AWS APIs)
    environment:
      - SERVICES=s3,dynamodb,sts
      - DEBUG=1
      - DATA_DIR=/var/lib/localstack
    volumes:
      - ./localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

